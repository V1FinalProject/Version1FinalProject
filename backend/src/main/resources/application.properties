spring.application.name=spring-hello-world
server.port=${PORT:8080}

# Set via the MONGODB_URI environment variable (backend/.env, gitignored) -
# never commit a connection string to this file. See AnthropicClientConfig for
# the same convention with ANTHROPIC_API_KEY.
spring.data.mongodb.uri=${MONGODB_URI}

# Path to the mock nominations spreadsheet, used to seed the database the first
# time it's empty. Relative to the directory the application is started from
# (backend/ when run via Maven).
tagging.nominations-file=../data/Star_Awards_Mock_Nominations.xlsx

# Spring Boot omits the exception's message from the default error body unless
# told otherwise. The ResponseStatusException reasons thrown across this app
# (bad nominee, self-nomination, one-per-quarter, ...) are plain, safe-to-show
# validation text - the frontend needs them to show the reviewer/nominator
# what actually went wrong, not a generic "something failed".
server.error.include-message=always
